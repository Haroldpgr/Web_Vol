# Render Blueprint (Zona 11): API + PostgreSQL. Alternativa a Railway.
# Uso: Dashboard de Render → New → Blueprint → conecta el repo.
services:
  - type: web
    name: volquetas-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: volquetas-db
          property: connectionString
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://volquetasaguazul.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: volquetas-db
    databaseName: volquetas
    user: volquetas
