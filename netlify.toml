# Netlify: frontend Vite (Zona 11). Alternativa a Vercel.
[build]
  command = "npm run build"
  publish = "dist"

# SPA: todas las rutas sirven index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché agresiva para assets con hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
